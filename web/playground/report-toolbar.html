<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="竞品分析看板报告头部布局方案 Playground">
  <title>报告头部方案 Playground</title>
  <link rel="stylesheet" href="./report-toolbar.css">
</head>
<body>
  <main class="playground-shell">
    <header class="playground-header">
      <div>
        <p class="eyebrow">JD COMPETITOR ANALYSIS</p>
        <h1>报告头部方案 Playground</h1>
        <p class="intro">5 个布局使用同一份商品与日期数据。点击“选择此方案”可做临时标记，正式看板不会受到影响。</p>
      </div>
      <output id="selection-output" class="selection-output" aria-live="polite">尚未选择方案</output>
    </header>

    <nav class="option-nav" aria-label="方案快速导航">
      <a href="#option-a">A 紧凑工具栏</a>
      <a href="#option-b">B 商品主导</a>
      <a href="#option-c">C 筛选主导</a>
      <a href="#option-d">D 双栏信息板</a>
      <a href="#option-e">E 极简摘要条</a>
    </nav>

    <div id="options" class="option-list"></div>
  </main>

  <script type="module" src="./report-toolbar.js"></script>
</body>
</html>
