<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="京东自营竞品准真实值分析看板">
  <title>竞品准真实值看板</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <main class="page">
    <header class="report-header">
      <div>
        <h1 id="title">竞品准真实值看板</h1>
      </div>
      <div class="data-status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="updated-at">等待数据</span>
      </div>
      <section class="report-toolbar" aria-label="报告信息与分析周期">
        <div class="pair-picker" id="pair-picker">
          <div class="pair-panel">
            <button class="pair-panel-trigger" id="pair-trigger" type="button" aria-expanded="false" aria-controls="pair-popover" aria-label="切换商品对">
              <span class="visually-hidden">切换商品对</span>
            </button>
            <header class="pair-panel-heading">
              <strong>当前商品对</strong>
              <span class="pair-panel-period">
                <span class="meta" id="meta">正在读取报告索引</span>
                <span class="pair-panel-chevron" aria-hidden="true"></span>
              </span>
            </header>
            <div class="product-comparison" id="product-comparison" aria-label="本品与竞品商品信息"></div>
            <div class="pair-popover" id="pair-popover" role="listbox" aria-label="选择商品对" hidden></div>
          </div>
        </div>
        <div class="report-controls">
          <div class="period-control" id="period-picker"></div>
          <div class="sku-control">
            <span>本品组成</span>
            <button id="sku-trigger" type="button" disabled>查看 SKU</button>
          </div>
        </div>
      </section>
    </header>

    <section class="page-state" id="page-state" aria-live="polite">正在加载报告数据</section>

    <div id="dashboard" hidden>
      <button class="report-status-banner" id="report-status-trigger" type="button" aria-haspopup="dialog" aria-controls="report-status-dialog" hidden>
        <span class="report-status-symbol" data-status-symbol aria-hidden="true">▲</span>
        <span class="report-status-copy">
          <strong data-status-title>数据不完整</strong>
          <span data-status-detail>-</span>
        </span>
        <span class="report-status-action">查看异常明细 ›</span>
      </button>

      <button class="hero" id="hero-summary-trigger" type="button" aria-haspopup="dialog" aria-controls="summary-dialog" aria-label="查看优点与弱点详情">
        <span class="hero-block">
          <span class="hero-label advantage">优点</span>
          <span class="summary" id="summary">-</span>
        </span>
        <span class="hero-block">
          <span class="hero-label warning">弱点</span>
          <span class="weakness-text" id="weakness">-</span>
        </span>
      </button>

      <section class="metrics-trend" aria-label="核心指标与趋势">
        <section class="metrics" id="metrics" aria-label="核心指标选择"></section>

        <section class="panel trend-panel" aria-labelledby="trend-title">
          <header class="trend-header">
            <div>
              <p class="trend-eyebrow">指标趋势</p>
              <h2 id="trend-title">成交金额趋势</h2>
            </div>
          </header>
          <div class="trend-chart" id="trend-chart" aria-live="polite">正在加载趋势数据</div>
        </section>
      </section>

      <section class="content">
        <article class="panel analysis-panel">
          <h2>差距来源分析</h2>
          <div class="tabs" id="tabs"></div>
          <div class="tab-body" id="tab-body"></div>
        </article>

        <aside class="panel ai-recommendations-panel">
          <h2>AI 劣势建议</h2>
          <div class="ai-recommendations-list" id="ai-recommendations"></div>
        </aside>
      </section>

      <footer class="footnote" id="risks">-</footer>
    </div>
  </main>

  <dialog class="sku-dialog" id="sku-dialog" aria-labelledby="sku-dialog-title">
    <header class="sku-dialog-header">
      <div>
        <h2 id="sku-dialog-title">本品 SKU 构成</h2>
        <p id="sku-dialog-meta">-</p>
      </div>
      <form method="dialog">
        <button class="sku-dialog-close" type="submit" aria-label="关闭 SKU 构成">×</button>
      </form>
    </header>
    <div class="sku-dialog-body" id="sku-dialog-body"></div>
    <footer class="sku-dialog-footer">
      <form method="dialog">
        <button class="sku-dialog-done" type="submit">关闭</button>
      </form>
    </footer>
  </dialog>

  <dialog class="summary-dialog" id="summary-dialog" aria-labelledby="summary-dialog-title">
    <header class="summary-dialog-header">
      <h2 id="summary-dialog-title">结论详情</h2>
      <form method="dialog">
        <button class="summary-dialog-close" type="submit" aria-label="关闭结论详情">×</button>
      </form>
    </header>
    <div class="summary-dialog-body">
      <section class="summary-dialog-section warning">
        <p class="summary-dialog-label">弱点</p>
        <ul class="summary-dialog-points" id="summary-dialog-weakness"><li>-</li></ul>
      </section>
      <section class="summary-dialog-section advantage">
        <p class="summary-dialog-label">优点</p>
        <ul class="summary-dialog-points" id="summary-dialog-advantage"><li>-</li></ul>
      </section>
    </div>
    <footer class="summary-dialog-footer">
      <form method="dialog">
        <button class="summary-dialog-done" type="submit">关闭</button>
      </form>
    </footer>
  </dialog>

  <dialog class="report-status-dialog" id="report-status-dialog" aria-labelledby="report-status-dialog-title">
    <header class="report-status-dialog-header">
      <div>
        <h2 id="report-status-dialog-title">报告状态明细</h2>
        <p id="report-status-dialog-subtitle">-</p>
      </div>
      <button class="report-status-dialog-close" type="button" data-report-status-close aria-label="关闭报告状态明细">×</button>
    </header>
    <div class="report-status-dialog-body" id="report-status-dialog-body"></div>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
